server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache fingerprinted/static assets aggressively. Keep HTML revalidated via location /.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|webm|pdf|glb)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
